id: com.termius.Termius
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: termius
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  # Electron is launched with --ozone-platform=x11, so XWayland is required.
  # Do not add --socket=wayland alongside this: flatpak-builder-lint rejects the
  # combination, and --socket=fallback-x11 would withhold X11 on Wayland sessions
  # and break the forced x11 backend.
  - --socket=x11
  - --socket=pulseaudio
  # Reuse the user's running ssh-agent instead of asking for key passphrases again.
  - --socket=ssh-auth
  # FIDO2 security keys (/dev/hidraw*) and serial consoles (/dev/ttyUSB*,
  # /dev/ttyACM*). Neither is covered by --device=usb or --device=input, so there
  # is no granular alternative yet.
  - --device=all
  # Termius is a terminal emulator: its purpose is to run the commands the user
  # types, including on the local machine, which it does via host-spawn. The
  # sandbox cannot meaningfully confine that, so these two are inherent to the app
  # rather than incidental.
  - --talk-name=org.freedesktop.Flatpak
  # Local shell working directories, SFTP browsing of local files and importing
  # existing ~/.ssh keys all need host paths at their real locations, which is what
  # `host` provides. `host-root` additionally exposes / (including /etc and /usr) at
  # /run/host/root, but it was only added in flatpak 1.17 and is silently ignored on
  # older hosts, so it cannot be relied on as the only filesystem permission.
  - --filesystem=host
  - --filesystem=host-root
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --env=TERMIUS_OFFICIAL_FLATPAK=1

modules:
  - name: fontconfig
    buildsystem: simple
    build-commands:
      - install -Dm644 local.conf -t $FLATPAK_DEST/etc/fonts/
      - install -Dm644 70-noto-cjk.conf -t $FLATPAK_DEST/etc/fonts/conf.d/
    sources:
      - type: file
        path: patch/local.conf
      - type: file
        url: https://gitlab.archlinux.org/archlinux/packaging/packages/noto-fonts-cjk/-/raw/5fd3534bf7a6e26c7506dc8f40dcd89f37d35627/70-noto-cjk.conf
        sha256: 2417ac0e6720fe8da55ee59f16e36cfe96737bc21432460a322bb0f395e3a521

  - name: host-spawn
    buildsystem: simple
    build-commands:
      - install -Dm755 host-spawn $FLATPAK_DEST/bin/host-spawn
    sources:
      - type: file
        url: https://github.com/1player/host-spawn/releases/download/v1.6.2/host-spawn-x86_64
        sha256: 077bc09a087292447ba17cfe2156a93f71bf56c4c6be8e38d3abe65c1240f34c
        dest-filename: host-spawn
        only-arches: [x86_64]
      - type: file
        url: https://github.com/1player/host-spawn/releases/download/v1.6.2/host-spawn-aarch64
        sha256: 8b30215b0b6b66c8c34a3e22d372dd39020295cd0904608bc2c5f5ecff829e5f
        dest-filename: host-spawn
        only-arches: [aarch64]

  - name: termius
    buildsystem: simple
    build-commands:
      - install -Dm644 $FLATPAK_ID.metainfo.xml -t $FLATPAK_DEST/share/metainfo
      - install -Dm644 $FLATPAK_ID.png -t $FLATPAK_DEST/share/icons/hicolor/512x512/apps
      - install -Dm644 $FLATPAK_ID.desktop -t $FLATPAK_DEST/share/applications
      - install -Dm755 termius.sh $FLATPAK_DEST/bin/termius
      - cp -a termius $FLATPAK_DEST/termius
    sources:
      - type: file
        path: com.termius.Termius.metainfo.xml
      - type: file
        path: com.termius.Termius.png
      - type: file
        path: com.termius.Termius.desktop
      - type: script
        dest-filename: termius.sh
        commands:
          - exec zypak-wrapper.sh "/app/termius/termius-app" --ozone-platform=x11
            "$@"
      - type: archive
        url: https://autoupdate.termius.com/canary/custom-build/flatpak-potato/linux-tar/Termius%20flatpak-potato-9.39.0-x64.tar.gz
        sha512: 5f791eb8228b58499a11d6cdf90646712ae922567a98da88df6d4f84e7b3bbed3907aadf46b75dbb43db9bd296584ac64462b2ca3602710694381d8cb332d8c6
        strip-components: 1
        dest: termius
        only-arches: [x86_64]
        x-checker-data:
          type: json
          url: https://autoupdate.termius.com/canary/custom-build/flatpak-potato/linux-tar/flatpak-checker-data.json
          version-query: .version
          url-query: .url
          release-url-template: https://docs.termius.com/changelog#id-$version
          is-main-source: true
      - type: archive
        url: https://autoupdate.termius.com/canary/custom-build/flatpak-potato/linux-tar-arm64/Termius%20flatpak-potato-9.39.0-arm64.tar.gz
        sha512: 2021ee94355539c053b6a10227f6b7a6511f5b02a5248a384b3895de4e96758937c62e6e07439a3be2bd80a8fcd489856421736d8c88ed6879b702e38a42255e
        strip-components: 1
        dest: termius
        only-arches: [aarch64]
        x-checker-data:
          type: json
          url: https://autoupdate.termius.com/canary/custom-build/flatpak-potato/linux-tar-arm64/flatpak-checker-data.json
          version-query: .version
          url-query: .url
          release-url-template: https://docs.termius.com/changelog#id-$version
